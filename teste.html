<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Card HTML5</title>
    <style>
        /* --- ESTILOS DO CARD PARA COPIAR E COLAR --- */

        /* Container principal do card */
        .skill-card {
            background-color: #ffffff; /* Fundo branco puro */
            border-radius: 20px; /* Bordas arredondadas */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); /* Sombra suave para elevação */
            width: 320px; /* Largura fixa para manter a proporção */
            overflow: hidden; /* Garante que nada saia do card */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Fonte limpa */
            margin: 20px auto; /* Centraliza o card na tela */
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* Efeitos de hover */
        }

        /* Efeito de destaque ao passar o mouse */
        .skill-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        /* Área superior do card (conteúdo principal) */
        .skill-card__content {
            padding: 30px;
            text-align: center;
        }

        /* Texto "HABILIDADES" no topo */
        .skill-card__subtitle {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        /* Bloco do ícone e título */
        .skill-card__logo-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; /* Espaço entre ícone e texto */
            margin-bottom: 20px;
        }

        /* Ícone do HTML5 */
        .skill-card__logo {
            width: 80px; /* Tamanho do ícone */
            height: auto;
        }

        /* Título "HTML" */
        .skill-card__title {
            font-size: 42px;
            font-weight: 700;
            color: #333;
            margin: 0;
            line-height: 1;
        }

        /* Barra de progresso e estrelas */
        .skill-card__metrics {
            margin-bottom: 25px;
        }

        /* Barra de progresso (conforme imagem) */
        .skill-card__progress {
            width: 100%;
            height: 10px;
            background-color: #f1f1f1; /* Fundo da barra */
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
        }

        /* O preenchimento da barra */
        .skill-card__progress-fill {
            height: 100%;
            background-color: #f6a066; /* Cor de preenchimento (laranja suave) */
            border-radius: 5px;
            position: relative;
        }

        /* O texto "90%" flutuante na ponta */
        .skill-card__progress-text {
            position: absolute;
            right: 0px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
        }

        /* Avaliação por estrelas */
        .skill-card__stars {
            color: #f6a066; /* Mesma cor das estrelas */
            font-size: 20px;
        }

        /* Estrela preenchida (unicode) */
        .skill-card__star--full::before {
            content: '★';
        }

        /* Lista de detalhes da habilidade */
        .skill-card__details {
            text-align: left;
            list-style: none;
            padding: 0;
            margin: 0;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Item da lista com bullet laranja */
        .skill-card__details li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
        }

        /* O bullet laranja customizado */
        .skill-card__details li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 7px;
            width: 8px;
            height: 8px;
            background-color: #f6a066;
            border-radius: 50%;
        }

        /* Rodapé do card (barra laranja) */
        .skill-card__footer {
            background-color: #f6a066;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

    </style>
</head>
<body>

    <!-- 
      --- CARD DE HABILIDADE HTML5 ---
      Copie todo este bloco <div class="skill-card"> 
      e o CSS acima para usar no seu site. 
    -->
    <div class="skill-card">
        <div class="skill-card__content">
            <span class="skill-card__subtitle">HABILIDADES</span>
            
            <div class="skill-card__logo-block">
                <!-- Certifique-se de ter a imagem 'html5_logo.png' ou use uma URL -->
                <img src="html5_logo.png" alt="Logo HTML5" class="skill-card__logo">
                <h1 class="skill-card__title">HTML</h1>
            </div>

            <div class="skill-card__metrics">
                <div class="skill-card__progress">
                    <!-- Ajuste o 'width' para mudar a porcentagem -->
                    <div class="skill-card__progress-fill" style="width: 90%;">
                        <span class="skill-card__progress-text">90%</span>
                    </div>
                </div>
                
                <div class="skill-card__stars">
                    <!-- Use as classes para definir as estrelas cheias -->
                    <span class="skill-card__star--full"></span>
                    <span class="skill-card__star--full"></span>
                    <span class="skill-card__star--full"></span>
                    <span class="skill-card__star--full"></span>
                    <span class="skill-card__star--full"></span>
                </div>
            </div>

            <ul class="skill-card__details">
                <li>Linguagem de Marcação e Estruturação de Conteúdo</li>
                <li>Semântica e Acessibilidade (WCAG)</li>
                <li>Otimização de Performance Web (WPO)</li>
                <li>Integração Avançada de Elementos Multimídia</li>
                <li>Compatibilidade Cross-Browser e Boas Práticas</li>
            </ul>
        </div>
        
        <div class="skill-card__footer">
            CONHECER
        </div>
    </div>
    <!-- --- FIM DO CARD --- -->

</body>
</html>
